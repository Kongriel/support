<!doctype html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nyt password</title>
    <link rel="stylesheet" href="/index.css" />
</head>

<body>
    <main class="container" style="padding-top:48px; padding-bottom:48px;">
        <section class="auth-card">
            <div class="auth-head">
                <h1 class="auth-title">Lav nyt password</h1>
                <p class="auth-sub">
                    Skriv dit nye password herunder.
                </p>
            </div>

            <form id="resetForm" class="auth-form">
                <label class="auth-label">
                    Nyt password
                    <input id="password" name="password" type="password" class="auth-input" autocomplete="new-password"
                        required minlength="8" />
                </label>

                <label class="auth-label">
                    Gentag password
                    <input id="password2" name="password2" type="password" class="auth-input"
                        autocomplete="new-password" required minlength="8" />
                </label>

                <button class="auth-btn" type="submit">Gem nyt password</button>

                <p id="resetMsg" class="auth-msg" aria-live="polite"></p>
            </form>

            <div class="auth-foot">
                <a class="auth-link" href="/login.html">Til login</a>
            </div>
        </section>
    </main>

    <script type="module" src="js/reset-password.js"></script>
</body>

</html>
