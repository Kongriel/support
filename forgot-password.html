<!doctype html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Glemt password</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <main class="container" style="padding-top:48px; padding-bottom:48px;">
        <section class="auth-card">
            <div class="auth-head">
                <h1 class="auth-title">Glemt password?</h1>
                <p class="auth-sub">
                    Skriv din email, så sender vi et link hvor du kan lave et nyt password.
                </p>
            </div>

            <form id="forgotForm" class="auth-form">
                <label class="auth-label">
                    Email
                    <input id="email" name="email" type="email" class="auth-input" autocomplete="email" required />
                </label>

                <button class="auth-btn" type="submit">Send reset-link</button>

                <p id="forgotMsg" class="auth-msg" aria-live="polite"></p>
            </form>

            <div class="auth-foot">
                <a class="auth-link" href="/login.html">Tilbage til login</a>
            </div>
        </section>
    </main>

    <script type="module" src="js/forgot-password.js"></script>
</body>

</html>
